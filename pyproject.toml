[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-routing-policy-simulator"
version = "1.0.0"
description = "Deterministic policy simulator for safe AI model routing"
requires-python = ">=3.11"

[project.scripts]
route-policy = "ai_model_routing_policy_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
