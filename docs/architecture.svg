<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f8fa"/>
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#111827">AI Model Routing Policy Simulator</text>
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="24" fill="#4b5563">Deterministic governance before model execution</text>
  <g font-family="Arial, sans-serif">
    <rect x="100" y="300" width="310" height="210" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="4"/>
    <text x="255" y="365" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">Request profile</text>
    <text x="255" y="410" text-anchor="middle" font-size="21" fill="#4b5563">data • risk • budget</text>
    <text x="255" y="445" text-anchor="middle" font-size="21" fill="#4b5563">latency • providers</text>

    <path d="M410 405 H555" stroke="#6366f1" stroke-width="7" fill="none" marker-end="url(#arrow)"/>

    <rect x="570" y="235" width="460" height="340" rx="28" fill="#eef2ff" stroke="#6366f1" stroke-width="5"/>
    <text x="800" y="315" text-anchor="middle" font-size="31" font-weight="700" fill="#312e81">Policy engine</text>
    <text x="800" y="365" text-anchor="middle" font-size="22" fill="#4338ca">provider + classification</text>
    <text x="800" y="405" text-anchor="middle" font-size="22" fill="#4338ca">risk + status</text>
    <text x="800" y="445" text-anchor="middle" font-size="22" fill="#4338ca">cost + latency</text>
    <text x="800" y="485" text-anchor="middle" font-size="22" fill="#4338ca">fallback + review policy</text>
    <rect x="680" y="515" width="240" height="42" rx="16" fill="#111827"/>
    <text x="800" y="544" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">NO MODEL CALLS</text>

    <path d="M1030 405 H1175" stroke="#6366f1" stroke-width="7" fill="none" marker-end="url(#arrow)"/>

    <rect x="1190" y="300" width="310" height="210" rx="24" fill="#ffffff" stroke="#a7f3d0" stroke-width="4"/>
    <text x="1345" y="360" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">Decision evidence</text>
    <text x="1345" y="405" text-anchor="middle" font-size="22" fill="#047857">ALLOW • REVIEW • BLOCK</text>
    <text x="1345" y="445" text-anchor="middle" font-size="20" fill="#4b5563">route + fallback</text>
    <text x="1345" y="478" text-anchor="middle" font-size="20" fill="#4b5563">reasons + fingerprint</text>

    <rect x="385" y="690" width="830" height="95" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text x="800" y="730" text-anchor="middle" font-size="23" font-weight="700" fill="#9a3412">Human approval and authenticated execution remain outside the simulator</text>
    <text x="800" y="765" text-anchor="middle" font-size="20" fill="#7c2d12">Policy evidence is advisory until a separate controlled gateway enforces it</text>
  </g>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#6366f1"/></marker></defs>
</svg>
